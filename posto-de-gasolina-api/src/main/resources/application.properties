spring.application.name=posto-de-gasolina-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/posto_gasolina}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:merito_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Rejeita campos não previstos nos DTOs, inclusive preço e total enviados em abastecimentos.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Cada operação documenta somente os erros que podem ocorrer nela.
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

server.port=${PORT:8080}
