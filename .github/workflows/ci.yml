name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: posto-de-gasolina-api

    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/posto_gasolina_test
      TEST_SPRING_DATASOURCE_USERNAME: merito_test
      TEST_SPRING_DATASOURCE_PASSWORD: merito_test_local

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: posto_gasolina_test
          POSTGRES_USER: merito_test
          POSTGRES_PASSWORD: merito_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merito_test -d posto_gasolina_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: posto-de-gasolina-api/pom.xml

      - name: Compilar e executar os testes
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode verify
